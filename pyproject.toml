[project]
name = "job-radar"
version = "0.1.0"
description = "Multi-source job collector for the Egyptian market"
requires-python = ">=3.12"
dependencies = [
    "scrapling>=0.2.9",
    "lxml>=5.2",
    "cssselect>=1.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "black>=24.4", "mypy>=1.10"]

[project.scripts]
job-radar = "job_radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
